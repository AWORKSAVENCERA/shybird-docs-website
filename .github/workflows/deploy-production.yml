name: Deploy Production Site  
 
# Trigger on pushes to the main branch  
on:  
  push:  
    branches: [ "main" ]  
 
jobs:  
  build-and-deploy:  
    runs-on: ubuntu-latest  
    steps:  
      # Step 1: Check out the code from the main branch  
      - name: Checkout main  
        uses: actions/checkout@v4  
 
      # Step 2: (Optional) Build your site (skip if using plain HTML)  
      # For static generators like Jekyll, Hugo, or Next.js, add build steps here.  
      # Example for Jekyll:  
      - name: Set up Ruby  
        uses: ruby/setup-ruby@v1  
        with:  
          ruby-version: '3.2'  
      - name: Install dependencies  
        run: bundle install  
      - name: Build Jekyll site  
        run: bundle exec jekyll build --destination _site  
 
      # Step 3: Deploy to gh-pages branch (root directory)  
      - name: Deploy to Production  
        uses: peaceiris/actions-gh-pages@v4  
        with:  
          github_token: ${{ secrets.GITHUB_TOKEN }}  # Auto-generated by GitHub  
          publish_branch: gh-pages                  # Branch to deploy to  
          publish_dir: _site                            # Directory with built files (use _site for Jekyll/Hugo)  
          destination_dir: .                        # Deploy to root of gh-pages  
          force_orphan: true                        # Keep gh-pages clean (only built files)
